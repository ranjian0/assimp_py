name: Zig Wheels

# Validation workflow for the zig cross-compilation wheel pipeline.
# Builds every Linux lane natively with zig (no emulated compilation),
# repairs + tests the wheels inside the matching manylinux/musllinux
# containers (emulated), and runs inspect checks over the artifacts.
# Manually dispatched; never publishes anything.

on:
  workflow_dispatch:

concurrency:
  group: zig-wheels-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0

jobs:
  build_wheels:
    name: zig ${{ matrix.arch }} ${{ matrix.libc }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686, aarch64, s390x, ppc64le, armv7l]
        libc: [gnu, musl]
        exclude:
          # armv7l gnu wheels were never part of the release matrix
          - arch: armv7l
            libc: gnu

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install build tooling
        run: pip install ziglang==${ZIG_VERSION} wheel auditwheel

      # binfmt handlers for the emulated auditwheel/pytest container step
      # (compilation itself never runs under emulation)
      - uses: docker/setup-qemu-action@v4

      - name: Restore zig cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-${{ matrix.arch }}-${{ matrix.libc }}-${{ env.ZIG_VERSION }}-assimp6.0.5
          restore-keys: |
            zig-${{ matrix.arch }}-${{ matrix.libc }}-${{ env.ZIG_VERSION }}-

      - name: Build + test wheels
        run: python scripts/build_wheels.py --arch ${{ matrix.arch }} --libc ${{ matrix.libc }} --repo . --out wheelhouse

      - name: Measure zig cache size
        run: |
          echo "## zig cache: ${{ matrix.arch }} ${{ matrix.libc }}" >> $GITHUB_STEP_SUMMARY
          echo '`'$(du -sh ~/.cache/zig | cut -f1)'`' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: artifact-linux-${{ matrix.arch }}-${{ matrix.libc }}
          path: wheelhouse/repaired/*.whl

  inspect:
    name: Inspect wheels
    needs: build_wheels
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: artifact-linux-*
          merge-multiple: true
          path: dist

      - name: Count, tags and twine check
        run: |
          pip install twine
          set -e
          count=$(ls dist/*.whl | wc -l)
          echo "wheels: $count (expected 33)"
          test "$count" -eq 33

          gnu=$(ls dist/ | grep -c 'manylinux' || true)
          musl=$(ls dist/ | grep -c 'musllinux' || true)
          echo "manylinux wheels: $gnu, musllinux wheels: $musl (expected 15 / 18)"
          test "$gnu" -eq 15
          test "$musl" -eq 18

          # gnu lanes must carry the manylinux2014 tag (glibc 2.17 compat)
          for arch in x86_64 i686 aarch64 s390x ppc64le; do
            ls dist/ | grep -q "manylinux2014_${arch}" || { echo "missing manylinux2014_${arch}"; exit 1; }
          done

          twine check dist/*.whl

      - name: Summary
        run: |
          {
            echo "## Zig wheel validation"
            echo
            echo "| wheel | size |"
            echo "|---|---|"
            for f in dist/*.whl; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> $GITHUB_STEP_SUMMARY
