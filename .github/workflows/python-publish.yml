name: Publish assimp-py to PyPI

on:
  workflow_dispatch:
    inputs:
      pypi_target:
        description: 'Deploy to Production or Test PyPI'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - test

  release:
    types: [published]

env:
  # Exact patterns keep free-threaded (cp314t etc.) builds out;
  # the extension does not declare free-threading support
  CIBW_BUILD: cp312-* cp313-* cp314-*
  CIBW_TEST_REQUIRES: pytest
  CIBW_TEST_COMMAND: pytest {project}/tests

jobs:
  build_wheels_windows:
    name: Build wheels on Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [AMD64, ARM64]
    env:
      CIBW_ARCHS: ${{matrix.arch}}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.14

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cibuildwheel==4.2.1

    - name: Build Python wheels
      run: python -m cibuildwheel --output-dir wheelhouse

    - uses: actions/upload-artifact@v7
      with:
        name: artifact-win-${{matrix.arch}}
        path: ./wheelhouse/*.whl

  build_wheels_mac:
    name: Build wheels on MacOS (universal2)
    runs-on: macos-latest
    env:
      CIBW_ARCHS: universal2

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        name: Set up Python
        with:
          python-version: '3.14'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.1

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: artifact-mac-universal2
          path: ./wheelhouse/*.whl

  build_wheels_manylinux:
    name: Build wheels on manylinux2014 for ${{ matrix.arch }}
    # aarch64 containers run natively on the free arm64 runners
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      # cibuildwheel defaults to the manylinux_2_28 image; we build against
      # manylinux2014 (glibc 2.17) for maximum compatibility - our symbol
      # usage stays within 2.17, so these wheels install everywhere newer too
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
      # scope to glibc builds only (the global cpXYZ-* patterns would also
      # match musllinux identifiers)
      CIBW_BUILD: cp312-manylinux* cp313-manylinux* cp314-manylinux*
      CIBW_ARCHS: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        name: Set up Python
        with:
          python-version: '3.14'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.1

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: artifact-manylinux-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_wheels_musllinux:
    name: Build wheels on musllinux_1_2 for ${{ matrix.arch }}
    # aarch64 containers run natively on the free arm64 runners
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      # scope to musl builds only (the global cpXYZ-* patterns would also
      # match manylinux identifiers)
      CIBW_BUILD: cp312-musllinux* cp313-musllinux* cp314-musllinux*
      CIBW_ARCHS: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        name: Set up Python
        with:
          python-version: '3.14'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.1

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: artifact-musllinux-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: '3.14'

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "tag $TAG does not match pyproject version $VERSION" >&2
            exit 1
          fi

      - name: Install build
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: artifact-source
          path: dist/*.tar.gz

  inspect:
    name: Inspect distribution
    needs: [build_wheels_windows, build_wheels_mac, build_wheels_manylinux, build_wheels_musllinux, build_sdist]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: artifact-*
          merge-multiple: true
          path: dist

      - name: Verify artifacts
        run: |
          pip install twine
          set -e

          wheels=$(ls dist/*.whl | wc -l)
          sdists=$(ls dist/*.tar.gz | wc -l)
          echo "wheels: $wheels (expected 21), sdists: $sdists (expected 1)"
          test "$wheels" -eq 21
          test "$sdists" -eq 1

          # one lane per platform
          for pattern in manylinux2014_x86_64 manylinux2014_aarch64 \
                         musllinux_1_2_x86_64 musllinux_1_2_aarch64 \
                         win_amd64 win_arm64 macosx; do
            n=$(ls dist/ | grep -c "$pattern" || true)
            test "$n" -eq 3 || { echo "expected 3 wheels matching $pattern, got $n"; exit 1; }
          done

          # sdist must be buildable from source: critical files present
          sdist=$(ls dist/*.tar.gz)
          for f in CMakeLists.txt src/assimp_py.c pyproject.toml setup.py \
                   LICENSE licenses/assimp-LICENSE; do
            tar -tzf "$sdist" | grep -q "assimp_py-.*/$f\$" || { echo "sdist missing $f"; exit 1; }
          done

          # wheels must not leak C sources; check every wheel
          for w in dist/*.whl; do
            if python -m zipfile -l "$w" | grep -E "\.c$"; then
              echo "wheel $w contains C sources"; exit 1
            fi
          done

          # the extension + stubs ship in every wheel
          for w in dist/*.whl; do
            python -m zipfile -l "$w" | grep -q "assimp_py.pyi" || { echo "wheel $w missing stub"; exit 1; }
            python -m zipfile -l "$w" | grep -Eq "assimp_py\.[^/ ]+\.(so|pyd)" || { echo "wheel $w missing extension"; exit 1; }
          done

          twine check dist/*

      - name: Summary
        run: |
          {
            echo "## Distribution"
            echo
            echo "| file | size |"
            echo "|---|---|"
            for f in dist/*; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> $GITHUB_STEP_SUMMARY

  upload_pypi:
    needs: [build_wheels_windows, build_wheels_mac, build_wheels_manylinux, build_wheels_musllinux, build_sdist, inspect]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: artifact-*
          merge-multiple: true
          path: dist

      - name: Publish to Production PyPI
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.pypi_target == 'production') || (github.event_name == 'release' && !github.event.release.prerelease) }}
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}

      - name: Publish to Test PyPI
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.pypi_target == 'test') || (github.event_name == 'release' && github.event.release.prerelease) }}
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
